# Local PostgreSQL for running PowerDAL's tests and examples.
#   docker compose up -d
#   export DB=postgres://pydal_test:pydal_test@localhost:5432/pydal_test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pydal_test
      POSTGRES_PASSWORD: pydal_test
      POSTGRES_DB: pydal_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pydal_test"]
      interval: 5s
      timeout: 5s
      retries: 10
